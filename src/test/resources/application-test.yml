server:
  shutdown: immediate

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

hmpps-auth:
  url: "http://localhost:8090/auth"

integration-hub-api:
  base-url: "http://localhost:8091"
  username: "consumer-client"
  password: "consumer-password"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
